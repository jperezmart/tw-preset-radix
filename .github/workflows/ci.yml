# SCAFFOLDING — a starting point, not canon. Unlike release.yml, nothing is
# bound to this filename: rename it, rewrite it, or delete it entirely.
#
# The template's four checks are all deleted here: this repo has no build, no
# tests and no linter. What is left verifies that the install resolves, which is
# the whole point of keeping the file — it is what makes a Dependabot PR mean
# something rather than merge unread.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json # reads devEngines.runtime
          cache: pnpm

      # CI does not publish: no id-token, no registry-url.
      - run: pnpm install --frozen-lockfile
